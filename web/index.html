<!DOCTYPE html>
<html>
<head>
    <title>Fast Trading Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            background: #0a0e27;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { 
            color: #00d4ff;
            margin-bottom: 5px;
            font-size: 2em;
            font-weight: 700;
        }
        .instrument { 
            font-size: 1.3em;
            color: #ffa500;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .grid { 
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #151932;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #1e2442;
            padding-bottom: 10px;
            font-weight: 600;
        }
        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .stat {
            background: #1e2442;
            padding: 12px;
            border-radius: 8px;
        }
        .stat-label {
            color: #888;
            font-size: 0.75em;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 1.4em;
            font-weight: 700;
        }
        .positive { color: #00ff88; }
        .negative { color: #ff4444; }
        .orders-list {
            max-height: 350px;
            overflow-y: auto;
        }
        .order-item {
            background: #1e2442;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }
        .order-type {
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.85em;
        }
        .buy { background: #00ff8844; color: #00ff88; }
        .sell { background: #ff444444; color: #ff4444; }
        .timestamp {
            color: #888;
            font-size: 0.8em;
        }
        .no-data {
            color: #666;
            text-align: center;
            padding: 30px;
            font-size: 0.9em;
        }
        .status {
            text-align: right;
            color: #888;
            font-size: 0.85em;
            margin-top: 15px;
        }
        .connected { color: #00ff88; }
        .disconnected { color: #ff4444; }
        
        .log-section {
            margin-top: 20px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .log-toggle {
            background: #00d4ff;
            color: #0a0e27;
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .log-viewer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            background: #0d1125;
            border-radius: 8px;
            margin-top: 10px;
        }
        .log-viewer.expanded {
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
        }
        .log-entry {
            font-size: 0.85em;
            padding: 6px 0;
            border-bottom: 1px solid #1a1f3a;
            font-family: 'SF Mono', Monaco, monospace;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-timestamp {
            color: #666;
            margin-right: 10px;
        }
        .log-level {
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 600;
            margin-right: 10px;
            font-size: 0.75em;
        }
        .log-level.INFO { background: #00d4ff44; color: #00d4ff; }
        .log-level.WARN { background: #ffa50044; color: #ffa500; }
        .log-level.ERROR { background: #ff444444; color: #ff4444; }
        .log-level.DEBUG { background: #88888844; color: #888; }
        .log-message {
            color: #e0e0e0;
        }
        
        @media (max-width: 1200px) {
            .grid { grid-template-columns: 1fr; }
            .position-grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1f3a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3050;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a4060;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Fast Options Trading</h1>
        <div class="instrument">
            <span id="instrumentName">Loading...</span>
        </div>
        
        <div class="grid">
            <div class="card">
                <h2>📊 Open Position</h2>
                <div class="position-grid">
                    <div class="stat">
                        <div class="stat-label">Lots</div>
                        <div class="stat-value" id="qtyLots">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Units</div>
                        <div class="stat-value" id="qtyUnits">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Total Value</div>
                        <div class="stat-value">₹<span id="totalValue">0.00</span></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Avg Price</div>
                        <div class="stat-value">₹<span id="avgPrice">0.00</span></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Last Price</div>
                        <div class="stat-value">₹<span id="cmp">0.00</span></div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">MTM P&L</div>
                        <div class="stat-value" id="mtm">₹0.00</div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>📈 Order History</h2>
                <div class="orders-list" id="ordersList">
                    <div class="no-data">No orders yet</div>
                </div>
            </div>
        </div>
        
        <div class="card log-section">
            <div class="log-header" onclick="toggleLogs()">
                <h2>📋 Activity Log</h2>
                <span class="log-toggle" id="logToggle">Show Logs</span>
            </div>
            <div class="log-viewer" id="logViewer">
                <div id="logEntries"></div>
            </div>
        </div>
        
        <div class="status">
            Status: <span id="status" class="disconnected">Connecting...</span> | 
            Last Update: <span id="lastUpdate">Never</span>
        </div>
    </div>

    <script>
        let ws;
        let logsExpanded = false;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 10;
        
        function toggleLogs() {
            logsExpanded = !logsExpanded;
            const viewer = document.getElementById('logViewer');
            const toggle = document.getElementById('logToggle');
            
            if (logsExpanded) {
                viewer.classList.add('expanded');
                toggle.textContent = 'Hide Logs';
                scrollLogsToBottom();
            } else {
                viewer.classList.remove('expanded');
                toggle.textContent = 'Show Logs';
            }
        }
        
        function scrollLogsToBottom() {
            const viewer = document.getElementById('logViewer');
            setTimeout(() => {
                viewer.scrollTop = viewer.scrollHeight;
            }, 100);
        }
        
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(protocol + '//' + window.location.host + '/ws');
            
            ws.onopen = () => {
                document.getElementById('status').textContent = 'Connected';
                document.getElementById('status').className = 'connected';
                reconnectAttempts = 0;
                console.log('WebSocket connected');
            };
            
            ws.onclose = () => {
                document.getElementById('status').textContent = 'Disconnected';
                document.getElementById('status').className = 'disconnected';
                console.log('WebSocket closed');
                
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                    console.log(`Reconnecting in ${delay}ms (attempt ${reconnectAttempts})`);
                    setTimeout(connect, delay);
                }
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateUI(data);
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };
        }
        
        function updateUI(data) {
            // Update instrument
            if (data.instrument) {
                document.getElementById('instrumentName').textContent = 
                    `${data.instrument.symbol} (${data.instrument.exchange})`;
            }
            
            // Update position
            const pos = data.position || {};
            document.getElementById('qtyLots').textContent = pos.qty_lots || 0;
            document.getElementById('qtyUnits').textContent = pos.qty_units || 0;
            document.getElementById('totalValue').textContent = (pos.total_value || 0).toFixed(2);
            document.getElementById('avgPrice').textContent = (pos.avg_price || 0).toFixed(2);
            document.getElementById('cmp').textContent = (pos.cmp || 0).toFixed(2);
            
            const mtmEl = document.getElementById('mtm');
            const mtm = pos.mtm || 0;
            const mtmPercent = pos.mtm_change_percent || 0;
            mtmEl.textContent = `₹${mtm.toFixed(2)} (${mtmPercent.toFixed(2)}%)`;
            mtmEl.className = 'stat-value ' + (mtm >= 0 ? 'positive' : 'negative');
            
            // Update orders
            const ordersEl = document.getElementById('ordersList');
            if (data.orderHistory && data.orderHistory.length > 0) {
                const ordersHTML = data.orderHistory.slice().reverse().map(order => {
                    const time = new Date(order.timestamp).toLocaleTimeString();
                    const status = order.status ? ` (${order.status})` : '';
                    return `
                        <div class="order-item">
                            <div>
                                <span class="order-type ${order.type.toLowerCase()}">${order.type}</span>
                                ${order.quantity} lots @ ₹${order.price.toFixed(2)}${status}
                            </div>
                            <div class="timestamp">${time}</div>
                        </div>
                    `;
                }).join('');
                ordersEl.innerHTML = ordersHTML;
            } else {
                ordersEl.innerHTML = '<div class="no-data">No orders yet</div>';
            }
            
            // Update logs with auto-scroll
            if (data.logs && data.logs.length > 0) {
                const logEntriesEl = document.getElementById('logEntries');
                const wasAtBottom = isScrolledToBottom(document.getElementById('logViewer'));
                
                const logsHTML = data.logs.slice().reverse().map(log => {
                    const time = new Date(log.timestamp).toLocaleTimeString();
                    return `
                        <div class="log-entry">
                            <span class="log-timestamp">${time}</span>
                            <span class="log-level ${log.level}">${log.level}</span>
                            <span class="log-message">${escapeHtml(log.message)}</span>
                        </div>
                    `;
                }).join('');
                logEntriesEl.innerHTML = logsHTML;
                
                // Auto-scroll if was at bottom
                if (logsExpanded && wasAtBottom) {
                    scrollLogsToBottom();
                }
            }
            
            // Update timestamp
            if (data.lastUpdate) {
                document.getElementById('lastUpdate').textContent = 
                    new Date(data.lastUpdate).toLocaleTimeString();
            }
        }
        
        function isScrolledToBottom(element) {
            return element.scrollHeight - element.scrollTop <= element.clientHeight + 50;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Start connection
        connect();
    </script>
</body>
</html>
